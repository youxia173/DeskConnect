name: Release Windows Linux Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build in Docker
        run: |
          docker build -f deploy/docker/Dockerfile.linux -t deskconnect-builder .
          docker run --rm -v "$PWD:/source" deskconnect-builder
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/install-dependencies
        id: deps
        with:
          qt-version: 6.8.3
          vcpkg-triplet: x64-windows-release
      - name: Build and package
        shell: pwsh
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON ${{ steps.deps.outputs.vcpkg-cmake-config }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cpack --config build-release/CPackConfig.cmake -C Release -G 'WIX;7Z' -B dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.7z
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore stable Android debug signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build and test Android
        working-directory: android
        run: |
          bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/DeskConnect-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Use vMAJOR.MINOR.PATCH or a prerelease tag'; exit 1; }
          test -n "$(find dist -name '*.msi' -print -quit)"
          test -n "$(find dist -name '*.deb' -print -quit)"
          test -n "$(find dist -name '*.apk' -print -quit)"
          (cd dist && sha256sum *.msi *.7z *.deb *.apk > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Published release already exists; use a new tag'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --title "DeskConnect $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          args=()
          [[ "$TAG" != *-* ]] || args+=(--prerelease)
          gh release edit "$TAG" --draft=false "${args[@]}"
