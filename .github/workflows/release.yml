name: Release Windows Linux Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build in Docker
        run: |
          docker build -f deploy/docker/Dockerfile.linux -t deskconnect-builder .
          version=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=(-e "VERSION_OVERRIDE=${GITHUB_REF_NAME#v}"); fi
          docker run --rm "${version[@]}" -v "$PWD:/source" deskconnect-builder
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/install-dependencies
        id: deps
        with:
          qt-version: 6.8.3
          vcpkg-triplet: x64-windows-release
      - name: Build and package
        shell: pwsh
        run: |
          cmake -P cmake/tests/GitVersionTests.cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON ${{ steps.deps.outputs.vcpkg-cmake-config }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-release/src/unittests --output-on-failure -R '^BluetoothTests$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cpack --config build-release/CPackConfig.cmake -C Release -G 'WIX;7Z;ZIP' -B dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -Filter '*-portable.zip')
          if ($packages.Count -eq 0) { throw 'Portable ZIP was not generated' }
          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              foreach ($required in @('DeskConnect.exe', 'deskconnect-core.exe', 'Qt6Core.dll', 'Qt6Bluetooth.dll', 'platforms/qwindows.dll', 'settings/DeskConnect.conf')) {
                $pattern = '(^|/)' + [regex]::Escape($required) + '$'
                if (-not ($entries -match $pattern)) { throw "Portable ZIP missing $required" }
              }
            } finally { $archive.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.7z
            dist/*.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - name: Restore stable Android debug signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build and test Android
        working-directory: android
        run: |
          suffix=()
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == *-* ]]; then
            suffix=("-PversionNameSuffix=-${GITHUB_REF_NAME#*-}")
          fi
          bash gradlew --no-daemon "${suffix[@]}" :app:assembleDebug :app:testDebugUnitTest
          mkdir -p ../dist
          label=branch
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then label="${GITHUB_REF_NAME#v}"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/DeskConnect-${label}-Android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Use vMAJOR.MINOR.PATCH or a prerelease tag'; exit 1; }
          test -n "$(find dist -name '*.msi' -print -quit)"
          test -n "$(find dist -name '*-portable.zip' -print -quit)"
          test -n "$(find dist -name '*.deb' -print -quit)"
          test -n "$(find dist -name '*.AppImage' -print -quit)"
          test -n "$(find dist -name '*.apk' -print -quit)"
          (cd dist && sha256sum *.msi *.7z *.zip *.deb *.AppImage *.apk > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Published release already exists; use a new tag'; exit 1; }
          else
            notes=(--generate-notes)
            if [[ "$TAG" == *-bluetooth.* ]]; then notes=(--notes-file docs/releases/bluetooth-preview.md); fi
            gh release create "$TAG" --verify-tag --draft --title "DeskConnect $TAG" "${notes[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
          args=()
          [[ "$TAG" != *-* ]] || args+=(--prerelease --latest=false)
          gh release edit "$TAG" --draft=false "${args[@]}"
